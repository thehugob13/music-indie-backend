services:
  - type: web
    name: music-indie-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: MEDIA_DATA_DIR
        value: /tmp/music-indie
      - key: YOUTUBE_API_KEY
        sync: false
